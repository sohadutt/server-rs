# Paths are relative to the project working directory.
host = 0.0.0.0
port = 8080
worker_threads = 4

document_root = public
index_file = index.html
not_found_page = 404.html
mime_types_file = local/mime.types
default_mime_type = application/octet-stream
max_static_file_size_mb = 64

log_level = info
log_console = true
log_file = true
log_directory = local/logs

# Optional CUPS server host[:port]. Empty means localhost:631.
# cups_server = print-server.example:631
cups_encryption_required = false
